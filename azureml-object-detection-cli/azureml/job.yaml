$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json

code: ../train
command: |
  sed -i "s|path:.*$|path: ${{ inputs.training_data }}|" custom-coco128.yaml
  yolo train \
    cfg=experiment_config.yaml \
    data=custom-coco128.yaml \
    model=${{ inputs.model_to_train }} \
    project=${{ outputs.trained_model }} \
    name=. \
    exist_ok=True

inputs:
  training_data:
    type: uri_folder
    path: azureml:coco128:1
  model_to_train:
    type: custom_model
    path: azureml:yolov8n:1

outputs:
  trained_model:
    type: uri_folder


environment: azureml:yolov8-environment@latest
compute: azureml:od-train-cluster-cpu

experiment_name: yolov8-experiment
display_name: yolov8-coco128-training-run08